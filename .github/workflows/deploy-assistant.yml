name: Deploy AI functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'src/lib/serviceLines.ts']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function and set its API key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          supabase secrets set --yes --project-ref "$PROJECT_REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          # The function checks the signed-in user itself (works with new Supabase keys).
          supabase functions deploy ask --yes --project-ref "$PROJECT_REF" --no-verify-jwt
          # The outreach function shares the service-line definitions with the web app.
          cp src/lib/serviceLines.ts supabase/functions/outreach/serviceLines.ts
          supabase functions deploy outreach --yes --project-ref "$PROJECT_REF" --no-verify-jwt
