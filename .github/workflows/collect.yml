name: Collect signals

on:
  schedule:
    - cron: '17 1 * * *'   # daily, 06:47 IST
    # Backup run: GitHub sometimes delays or skips scheduled jobs. Already-stored articles are skipped.
    - cron: '43 8 * * *'   # daily, 14:13 IST
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated sources: google_news, sec_edgar, press_release (gdelt optional; often rate-limited)'
        required: false
        default: 'google_news,sec_edgar,press_release'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MAX_CLASSIFY: ${{ vars.MAX_CLASSIFY }}
          SOURCES: ${{ inputs.sources }}
